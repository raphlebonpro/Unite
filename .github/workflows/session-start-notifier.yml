name: Session Start Notifier

on:
  schedule:
    - cron: "*/5 * * * *" # toutes les 5 minutes
  workflow_dispatch: # permet de lancer manuellement

jobs:
  call-session-start-notifier:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase relay
        run: |
          curl -X POST "https://vznufgpbrunadydudbix.supabase.co/functions/v1/relay" \
            -H "Content-Type: application/json" \
            -H "x-relay-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -d '{"target":"session_start_notifier"}'
